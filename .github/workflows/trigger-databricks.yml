
name: Trigger Databricks Job

on:
  workflow_dispatch:

jobs:
  trigger-databricks:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Databricks Job
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_JOB_ID: ${{ secrets.DATABRICKS_JOB_ID }}
        run: |
          set -euo pipefail

          RESPONSE=$(curl --fail-with-body --silent --show-error \
            --request POST \
            "${DATABRICKS_HOST}/api/2.2/jobs/run-now" \
            --header "Authorization: Bearer ${DATABRICKS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$(jq -n \
              --argjson job_id "$DATABRICKS_JOB_ID" \
              '{job_id: $job_id}')")

          RUN_ID=$(echo "$RESPONSE" | jq -er '.run_id')

          echo "Databricks job triggered successfully."
          echo "Run ID: $RUN_ID"
          echo "Job URL: ${DATABRICKS_HOST}/jobs/${DATABRICKS_JOB_ID}/runs/${RUN_ID}"
