
name: Test Databricks Authentication

on:
  workflow_dispatch:

jobs:
  test-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Validate Databricks credentials
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$DATABRICKS_HOST" || -z "$DATABRICKS_TOKEN" ]]; then
            echo "ERROR: Workspace URL or token secret is empty."
            exit 1
          fi

          echo "Checking workspace URL format..."

          if [[ ! "$DATABRICKS_HOST" =~ ^https://[^/]+/?$ ]]; then
            echo "ERROR: DATABRICKS_HOST must be the HTTPS workspace URL only."
            exit 1
          fi

          DATABRICKS_HOST="${DATABRICKS_HOST%/}"

          echo "Checking Databricks authentication..."

          HTTP_CODE=$(curl --silent --show-error \
            --output /tmp/dbx-response.json \
            --write-out "%{http_code}" \
            "${DATABRICKS_HOST}/api/2.0/preview/scim/v2/Me" \
            --header "Authorization: Bearer ${DATABRICKS_TOKEN}")

          echo "HTTP status: $HTTP_CODE"

          if [[ "$HTTP_CODE" == "200" ]]; then
            echo "Authentication successful."
            jq '{userName, displayName}' /tmp/dbx-response.json
          else
            echo "Authentication check failed. Response:"
            jq -c '{error_code, message, detail}' \
              /tmp/dbx-response.json 2>/dev/null \
              || sed -n '1,10p' /tmp/dbx-response.json
            exit 1
          fi
